# Local dev stack. Only the gateway is published to the host; LiteLLM and Postgres
# live on an internal network so agents cannot bypass the authorization gate.
name: ai-agent-gateway

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }   # rotated logs: 5 x 10 MB per service

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: litellm
      # read by config/db-init.sh to create the least-privilege roles
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?set in .env}
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD:?set in .env}
      GATEWAY_APP_PASSWORD: ${GATEWAY_APP_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/db-init.sh:/docker-entrypoint-initdb.d/01-db-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped
    logging: *logging

  litellm:
    # LiteLLM 1.104.0 (main-stable as of 2026-10-03), pinned by digest.
    image: docker.litellm.ai/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql://litellm_app:${LITELLM_DB_PASSWORD}@db:5432/litellm
      LITELLM_LOCAL_MODEL_COST_MAP: "True"   # prices from the pinned image, not fetched from GitHub
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [backend]
    restart: unless-stopped
    logging: *logging

  migrate:
    # One-shot: applies gateway/migrations as gateway_owner, then exits.
    build: { context: ./gateway, target: base }
    image: ai-agent-gateway:local
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://gateway_owner:${GATEWAY_OWNER_PASSWORD}@db:5432/gateway
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    logging: *logging

  gateway:
    image: ai-agent-gateway:local
    # Explicit env list: the gateway never sees the salt key, provider keys or owner password.
    environment:
      DATABASE_URL: postgresql://gateway_app:${GATEWAY_APP_PASSWORD}@db:5432/gateway
      LITELLM_URL: http://litellm:4000
      LITELLM_GATEWAY_KEY: ${LITELLM_GATEWAY_KEY:?set in .env}
      # Only for the console's Providers page (add/remove provider keys and models in LiteLLM).
      # LiteLLM never returns stored keys unmasked, and the gateway never gets LITELLM_SALT_KEY.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}               # DEBUG shows every step of every request (no content)
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      # Where MCP tool servers (ToolHive on the host) fetch the keys that verify the gateway's passes.
      GATEWAY_ISSUER: ${GATEWAY_ISSUER:-http://127.0.0.1:${GATEWAY_PORT:-8080}}
    extra_hosts: ["host.docker.internal:host-gateway"]  # tool servers run on the host (ToolHive), not in this network
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]   # the only service published to the host
    depends_on:
      migrate: { condition: service_completed_successfully }
      litellm: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend]
    restart: unless-stopped
    logging: *logging

networks:
  backend:

volumes:
  pgdata:
