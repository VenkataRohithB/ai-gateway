# LiteLLM model routing. Version-controlled; secrets come from env via os.environ/.
# Models are defined here (not in the DB/UI) so routing is reviewable in git.
model_list:
  - model_name: gemini-2.5-flash       # public alias agents/policies refer to
    litellm_params:
      model: gemini/gemini-2.5-flash    # Google AI Studio (Gemini API)
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false

litellm_settings:
  drop_params: false
  turn_off_message_logging: true        # don't persist prompt/response content
